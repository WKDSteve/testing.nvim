# CI of tasks.nvim: one pipeline, two kinds of runner.
#
# What is checked lives only in the `ci` section of .testing.lua; every leg runs it with `scripts/ci.sh` (`testing ci`),
# exactly as the pre-push hook and `:Testing ci` do. This file only prepares the machine.
#
# - push to main: the self-hosted runner (the maintainer's local Windows machine), tools on its PATH. Without a running
#   runner a push stays "Queued" (no red mark, discarded after 24 h).
# - pull_request (also from forks): GitHub-hosted runners, a throwaway VM with a read-only token and no secrets (every
#   dependency is a public repository). A pull request never runs on the self-hosted runner: it would run its own
#   workflow code on the maintainer's machine. The hosted legs pin the versions the self-hosted runner has (nvim
#   0.12.2, stylua 2.5.2, luacheck 1.2.0, Node 22); a difference between the two is a finding.
# - macOS: a GitHub-hosted leg on every event, also on a push: the repository is public, so it costs nothing, and no
#   self-hosted runner has macOS. It runs the steps that depend on the platform: the suite and conformance.
# - workflow_dispatch: started by hand with `gh workflow run ci.yml` (write access only), the hosted legs as for a
#   pull request. It replaces a run GitHub left hanging without jobs (cancel and rerun fail there); `testing ci
#   remote` counts push runs only, so the next push is still the verdict.
#
# A fork can edit this file in its pull request (e.g. `runs-on: self-hosted`). The repository therefore requires
# approval before a workflow of an outside contributor runs; never approve a pull request that touches `.github/`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group: a run by hand must not cancel a push, and a push must not cancel it.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: testing ci (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the other.
      fail-fast: false
      matrix:
        # Only a push to main uses the self-hosted runner (the whole `full` profile); every other event, also one added
        # later (workflow_dispatch, pull_request_target, ...), gets hosted runners: the whole profile on ubuntu, and on
        # windows and macOS the steps that depend on the platform (stylua, luacheck and the Node contract check do not).
        include: ${{ fromJSON(github.event_name == 'push' && '[{"name":"windows","runs-on":["self-hosted","windows"],"hosted":false,"steps":""},{"name":"macos","runs-on":"macos-latest","hosted":true,"steps":"--step=suite,conformance"}]' || '[{"name":"ubuntu","runs-on":"ubuntu-latest","hosted":true,"steps":""},{"name":"windows","runs-on":"windows-latest","hosted":true,"steps":"--step=suite,conformance"},{"name":"macos","runs-on":"macos-latest","hosted":true,"steps":"--step=suite,conformance"}]') }}
    defaults:
      run:
        # One shell on every runner: `bash` is the WSL launcher on the self-hosted machine, pwsh is everywhere.
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Found by scripts/test.sh in `.deps/<name>`. lib.nvim and testing.nvim come from the branch that only moves
      # once the dependency's own CI is green.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: WKDSteve/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # The dashboard specs drive the real Snacks picker; without it they would pass with no assertion.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: folke/snacks.nvim
          path: .deps/snacks.nvim
          # Pinned: third-party code runs inside the specs on the self-hosted runner. Bump on purpose.
          ref: 882c996cf28183f4d63640de0b4c02ec886d01f2
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: WKDSteve/testing.nvim
          path: .deps/testing.nvim
          ref: ci-verified
      # Hosted legs only: the tools the self-hosted runner has on its PATH.
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        if: matrix.hosted
        with:
          neovim: true
          version: v0.12.2
      # The action installs stylua on PATH; `--version` only proves it is there, the check itself is the pipeline's.
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        if: matrix.hosted && matrix.steps == ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --version
      # luacheck as the release binary of lunarmodules, its sha256 pinned (checked against the maintainer's signature;
      # the file scripts/wsl-tools.sh of testing.nvim installs): no Lua from www.lua.org, whose download timed out.
      # `std = "luajit"` in .luacheckrc decides what is checked against.
      - if: matrix.hosted && matrix.steps == ''
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luacheck" "https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck"
          echo "d68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc  $RUNNER_TEMP/luacheck" | sha256sum -c -
          install -D -m 755 "$RUNNER_TEMP/luacheck" "$HOME/.local/bin/luacheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.hosted && matrix.steps == ''
        with:
          node-version: "22"
      - name: scripts/ci.sh ${{ matrix.steps }}
        env:
          TASKS_REQUIRE_SNACKS: "1"
          CI_STEPS: ${{ matrix.steps }}
          CI_REPORT: ${{ runner.temp }}/ci-report.json
          CI_IR: ${{ runner.temp }}/suite-ir.json
        run: |
          nvim --version | Select-Object -First 1
          # Git Bash on Windows (never the WSL launcher), bash elsewhere; scripts/ci.sh is a bash script.
          $bash = if ($IsWindows) { Join-Path $env:ProgramFiles 'Git\bin\bash.exe' } else { 'bash' }
          $steps = @($env:CI_STEPS -split ' ' | Where-Object { $_ })
          & $bash scripts/ci.sh @steps --keep-going --no-agent "--json=$env:CI_REPORT" -- "--json=$env:CI_IR"
          exit $LASTEXITCODE
      # The report names every step and, for a red one, its findings or last output lines; the suite IR (everything
      # after `--` goes to the suite step) names the failing case and its assertions.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ci-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/ci-report.json
            ${{ runner.temp }}/suite-ir.json
          if-no-files-found: ignore
          retention-days: 14
